services:
  db:
    image: pgvector/pgvector:pg16
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: recoveros
      POSTGRES_USER: recoveros
      POSTGRES_PASSWORD: recoveros
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveros"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveros:recoveros@db:5432/recoveros
      REDIS_URL: redis://redis:6379/0
    command: celery -A workers.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoveros:recoveros@db:5432/recoveros
      REDIS_URL: redis://redis:6379/0
    ports: ["8001:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes: ["ollama-models:/root/.ollama"]
volumes:
  postgres-data:
  ollama-models:
